<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Sticker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
/* Layout (mobile only, a phone-shaped column on desktop): the pixel picture on top, the tray right under it, the sticker sheet filling the rest, helpers at the bottom. One look in all themes. */
:root {
  color-scheme: light;
  --mat: #2B5F8A;
  --mat-deep: #1C4466;
  --mat-line: rgba(255, 255, 255, 0.09);
  --paper: #FBFAF6;
  --paper-2: #EFEDE5;
  --ink: #2A2438;
  --ink-soft: #666074;
  --on-mat: #FFFFFF;
  --accent: #FF5A6E;
  --gold: #FFC62E;
  --good: #2E9E5B;
  --font-display: 'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; max-width: 430px; margin: 0 auto; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding-block: 8px; min-height: 0; }
.grow { flex: 1; min-height: 0; }

.btn {
  font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.1; min-height: 46px; padding: 9px 16px;
  border-radius: 16px; border: 3px solid #FFF; background: var(--paper-2); color: var(--ink);
  box-shadow: 0 0 0 1px rgba(42,36,56,.28), 0 4px 0 rgba(20,16,32,.28);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 1px rgba(42,36,56,.28), 0 1px 0 rgba(20,16,32,.28); }
.btn.primary { background: var(--gold); }
.btn.big { font-size: 18px; min-height: 54px; border-radius: 20px; }
.btn.wide { width: 100%; }
.btn.sq { width: 44px; min-height: 44px; padding: 0; flex: none; }
.ico { width: 22px; height: 22px; flex: none; }

/* Home */
.logo { text-align: center; padding-top: 6px; }
.logo h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; color: var(--accent); paint-order: stroke fill; -webkit-text-stroke: 9px #FFF; filter: drop-shadow(0 3px 0 rgba(20,16,32,.3)); }
.logo p { margin: 6px auto 0; color: var(--on-mat); font-weight: 700; font-size: 14px; line-height: 1.4; max-width: 32ch; text-wrap: balance; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: none; padding: 8px 6px 4px; }
/* The picture list scrolls; the play button stays pinned at the bottom. */
#home { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.4) transparent; }
#home .logo { flex: none; }
#home .grow { flex: 0 0 4px; }
#home > .btn.big { position: sticky; bottom: 0; flex: none; z-index: 2; box-shadow: 0 0 0 1px rgba(42,36,56,.28), 0 4px 0 rgba(20,16,32,.28), 0 -10px 18px rgba(20,40,70,.45); }
.tile {
  border: 0; border-radius: 16px; background: var(--paper); padding: 8px 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 4px 0 rgba(20,16,32,.28); min-width: 0;
}
.tile canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; image-rendering: pixelated; }
.tile b { font-family: var(--font-display); font-size: 14px; line-height: 1.1; }
.tile .stars { display: flex; min-height: 14px; }
.tile.now { outline: 4px solid var(--gold); }
.tile:disabled { opacity: .55; cursor: default; }
.star { width: 14px; height: 14px; }

/* Play */
.hud { display: flex; align-items: center; gap: 8px; color: var(--on-mat); }
.hud .mid { flex: 1; min-width: 0; line-height: 1.15; }
.hud .mid b { display: block; font-family: var(--font-display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .mid span { display: block; font-size: 12px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct { flex: none; min-width: 58px; text-align: center; padding: 4px 10px; border-radius: 12px; background: var(--paper); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 18px; box-shadow: 0 2px 0 rgba(20,16,32,.25); font-variant-numeric: tabular-nums; }
.hud-stars { display: flex; background: var(--paper); border-radius: 12px; padding: 5px 6px; box-shadow: 0 2px 0 rgba(20,16,32,.25); }
.hud-stars .star { width: 18px; height: 18px; }
.art-card { flex: none; align-self: center; background: var(--paper); border-radius: 16px; padding: 6px; box-shadow: 0 4px 0 rgba(20,16,32,.28); position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.art-card canvas { display: block; }
#trays { display: block; width: 100%; flex: none; }
.stage { position: relative; flex: 1; min-height: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.btn.help { font-size: 20px; }
/* First-time popup for a special sticker: the sticker drawn with its tape or face-down. */
.mech-pic { position: relative; align-self: center; width: 72px; height: 72px; margin: 4px 0; }
.mech-pic canvas { display: block; width: 72px; height: 72px; }
.mech-pic.tape::before { content: ""; position: absolute; left: -8px; right: -8px; top: 25px; height: 22px; background: rgba(255,214,84,.95); transform: rotate(-24deg); }
.mech-pic i { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px; border-radius: 50%; background: var(--ink); color: #FFF; border: 2px solid #FFD654; display: grid; place-items: center; font: 800 16px/1 var(--font-display); font-style: normal; }
.mech-pic.mystery canvas { filter: brightness(.3) saturate(0); }
.mech-pic.mystery i { border-color: #FFF; }
/* How to play */
.howto .goal { display: flex; align-items: center; gap: 12px; background: #FFF6D8; border: 2px solid var(--gold); border-radius: 14px; padding: 10px 12px; }
.howto .goal canvas { flex: none; border-radius: 6px; image-rendering: pixelated; box-shadow: 0 0 0 2px #FFF; }
.howto .goal p { margin: 0; text-align: left; color: var(--ink); font-weight: 700; line-height: 1.35; }
.howto .goal p b { display: block; font-family: var(--font-display); font-size: 18px; }
.howto ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.howto li { display: flex; align-items: center; gap: 10px; text-align: left; font-size: 14px; line-height: 1.35; color: var(--ink); }
.howto li .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #FFF; font-family: var(--font-display); font-weight: 800; display: grid; place-items: center; }
.howto li .pic { flex: none; width: 92px; display: flex; justify-content: center; align-items: center; gap: 3px; padding: 5px; border-radius: 12px; }
.howto li .pic.tray { border: 2px solid var(--c); background: var(--tint); }
.howto li .pic.wait { background: #E6E8EC; border: 2px dashed #F0645A; }
.howto li .pic i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.8); display: block; }
.howto li .pic canvas { width: 22px; height: 22px; display: block; }
.howto li .pic.big canvas { width: 44px; height: 44px; }
.howto .rule { margin: 0; font-size: 13px; color: var(--ink-soft); text-align: center; line-height: 1.45; }
.howto .rule b { color: var(--ink); }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 8px); z-index: 4; pointer-events: none; max-width: 92%; width: max-content; background: var(--ink); color: #FFF; border-radius: 12px; padding: 7px 12px; font-weight: 700; font-size: 13px; line-height: 1.3; text-align: center; opacity: 0; transition: opacity .15s, transform .15s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.boosters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.boost { position: relative; min-height: 42px; border-radius: 16px; border: 3px solid #FFF; background: var(--paper-2); box-shadow: 0 0 0 1px rgba(42,36,56,.28), 0 4px 0 rgba(20,16,32,.28); display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 700; font-size: 12px; white-space: nowrap; color: var(--ink); }
.boost:active { transform: translateY(3px); box-shadow: 0 0 0 1px rgba(42,36,56,.28), 0 1px 0 rgba(20,16,32,.28); }
.boost .n { position: absolute; top: -8px; right: -5px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; background: var(--ink); color: #FFF; border: 2px solid #FFF; font-family: var(--font-display); font-weight: 800; font-size: 12px; line-height: 18px; text-align: center; }
/* A helper that could not act bumps; the helper that would help most wiggles with a glow. */
/* The magnet button while the player chooses a tray. */
.boost.on { outline: 3px solid #FFD654; outline-offset: 2px; transform: translateY(2px); }
.boost.nope { animation: nope .35s ease; }
@keyframes nope { 20% { transform: translateX(-6px) rotate(-3deg); } 45% { transform: translateX(5px) rotate(2deg); } 70% { transform: translateX(-3px); } }
.boost.hint { animation: hint 1.4s ease-in-out infinite; }
@keyframes hint { 0%, 70%, 100% { transform: none; filter: none; } 78% { transform: rotate(-5deg) scale(1.06); filter: drop-shadow(0 0 6px #FFD654); } 86% { transform: rotate(5deg) scale(1.06); filter: drop-shadow(0 0 8px #FFD654); } 94% { transform: rotate(-2deg); } }
@media (prefers-reduced-motion: reduce) { .boost.nope, .boost.hint { animation: none; } .boost.hint { outline: 3px solid #FFD654; } }
.boost:disabled { filter: grayscale(.8); opacity: .5; cursor: default; }

/* Popup */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(10,22,36,.6); display: flex; align-items: center; justify-content: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--paper); border-radius: 20px; width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.35); animation: drop .25s cubic-bezier(.2,1.3,.5,1); }
@keyframes drop { from { transform: translateY(14px) scale(.96); opacity: 0; } }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; text-align: center; text-wrap: balance; }
.card p { margin: 0; color: var(--ink-soft); line-height: 1.45; text-align: center; }
.card .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.card .framed { align-self: center; border: 6px solid #FFF; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); transform: rotate(-2deg); image-rendering: pixelated; transition: transform .35s cubic-bezier(.2,1.6,.5,1), box-shadow .35s; }
.card .framed.developed { transform: rotate(-2deg) scale(1.05); box-shadow: 0 0 0 3px var(--gold), 0 8px 24px rgba(0,0,0,.3); }
.big-stars { display: flex; justify-content: center; gap: 4px; }
.big-stars .star { width: 52px; height: 52px; animation: pop .4s cubic-bezier(.2,1.7,.5,1) backwards; }
.big-stars .star:nth-child(2) { transform: translateY(-8px); animation-delay: .18s; }
.big-stars .star:nth-child(3) { animation-delay: .36s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } }
#fly, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fly { z-index: 10; }
#fx { z-index: 40; }
/* ---------- Craft look: wooden plaques, a quilted frame and sheet, stitched edges, candy-coloured helpers ---------- */
#app::before { content: ''; position: absolute; inset: 3px -9px; border: 2px dashed rgba(255,255,255,.28); border-radius: 20px; pointer-events: none; }
#play .hud .btn.sq, #play .hud .mid, #play .hud-stars, #play .pct {
  background: linear-gradient(#FCEBCB, #E8C48C); border: 3px solid #A8733E; color: #4A2C16;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(150,95,40,.22), 0 3px 0 rgba(40,24,10,.35);
}
#play .hud .btn.sq { width: 46px; min-height: 46px; border-radius: 14px; }
#play .hud .btn.sq:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.65), 0 1px 0 rgba(40,24,10,.35); }
#play .hud .btn.help { border-radius: 50%; color: #4A2C16; }
#play .hud .mid { padding: 4px 10px; border-radius: 14px; text-align: center; }
#play .hud .mid b { font-size: 16px; }
#play .hud .mid span { font-size: 11px; opacity: .8; }
#play .hud { gap: 6px; }
#play .hud-stars { padding: 6px 5px; }
#play .hud-stars .star { width: 15px; height: 15px; }
#play .pct { width: 48px; height: 48px; font-size: 15px; }
#play .hud-stars { border-radius: 14px; padding: 6px 7px; }
#play .pct { width: 52px; height: 52px; min-width: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }
#play .art-card {
  padding: 12px; border-radius: 22px; border: 3px solid #A8733E;
  background-color: #E4BD86;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.2) 0 1.5px, transparent 1.5px 12px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.2) 0 1.5px, transparent 1.5px 12px), linear-gradient(#F0D3A4, #D9AE72);
  box-shadow: inset 0 0 0 3px rgba(255,246,226,.55), 0 4px 0 rgba(40,24,10,.35);
}
#play .art-card canvas { border-radius: 4px; box-shadow: 0 0 0 4px #FFF8EA; outline: 2px dashed rgba(140,90,40,.65); outline-offset: 6px; }
#play .boost {
  color: #FFF; border: 3px solid rgba(255,255,255,.8); font-family: var(--font-display); font-weight: 800; font-size: 14px;
  text-shadow: 0 1px 0 rgba(70,20,0,.4); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 4px 0 rgba(40,24,10,.35);
}
#play .boost:active { box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 1px 0 rgba(40,24,10,.35); }
#play .boost:nth-child(1) { background: linear-gradient(#FFC766, #FF9426); }
#play .boost:nth-child(2) { background: linear-gradient(#FFA287, #F2654C); }
#play .boost:nth-child(3) { background: linear-gradient(#C8A6FF, #8E63E9); }
#play .boost .ico { background: rgba(255,255,255,.88); border-radius: 8px; padding: 2px; width: 24px; height: 24px; }
#play .boost .n { background: #E8453C; }
/* Hard pictures: a red tag on the plaque and the gallery tile, and a banner when they start. */
#play.hard .hud .mid { background: linear-gradient(#FFB4A8, #F2705C); border-color: #9E2E22; color: #FFF; }
#play.hard .hud .mid span { opacity: 1; font-weight: 800; }
.tile.hard { box-shadow: 0 0 0 3px #E8453C, 0 4px 0 rgba(20,16,32,.28); position: relative; }
.tile.hard::after { content: 'KHÓ'; position: absolute; top: -8px; right: -6px; background: #E8453C; color: #FFF; font-family: var(--font-display); font-weight: 800; font-size: 11px; padding: 2px 7px; border-radius: 9px; border: 2px solid #FFF; }
.hard-splash { position: fixed; left: 50%; top: 38%; z-index: 30; transform: translate(-50%, -50%) rotate(-3deg); pointer-events: none; text-align: center; background: linear-gradient(#FF7A64, #E8453C); color: #FFF; border: 4px solid #FFF; border-radius: 20px; padding: 12px 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: splash 2s ease forwards; }
/* Praise word: pops over the top of the sticker sheet, then floats up and fades. */
.praise { position: absolute; left: 50%; top: 22%; z-index: 4; pointer-events: none; white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; color: #FFD43B; paint-order: stroke fill; -webkit-text-stroke: 7px #7A3FE0; filter: drop-shadow(0 4px 0 rgba(40,20,70,.35)); animation: praise 1.2s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes praise { 0% { transform: translate(-50%, 0) scale(.3) rotate(-8deg); opacity: 0; } 18% { transform: translate(-50%, 0) scale(1.12) rotate(-4deg); opacity: 1; } 30% { transform: translate(-50%, 0) scale(1) rotate(-4deg); } 75% { transform: translate(-50%, -14px) scale(1) rotate(-4deg); opacity: 1; } 100% { transform: translate(-50%, -34px) scale(.92) rotate(-4deg); opacity: 0; } }
.perfect { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: #FFF; background: linear-gradient(#FFB020, #FF7A2F); border-radius: 999px; padding: 4px 18px; transform: rotate(-3deg); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
@media (prefers-reduced-motion: reduce) { .praise { animation: none; transform: translate(-50%, 0); } }
.hard-splash b { display: block; font-family: var(--font-display); font-size: 34px; line-height: 1; letter-spacing: 1px; }
.hard-splash span { display: block; font-size: 13px; font-weight: 700; margin-top: 4px; }
@keyframes splash { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-3deg) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -50%) rotate(-3deg) scale(1.08); } 25% { transform: translate(-50%, -50%) rotate(-3deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) rotate(-3deg) scale(1); } }
/* Sticker book: the book is its own frame, so the wooden card around the picture steps back. */
#play .art-card { padding: 0; background: none; border: 0; box-shadow: 0 6px 0 rgba(40,24,10,.35); border-radius: 14px; }
#play .art-card canvas { outline: none; box-shadow: none; border-radius: 0; }
.tile canvas.mini-book { aspect-ratio: 5 / 3; border-radius: 6px; image-rendering: auto; }
.card .page-shot { align-self: center; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.3); transform: rotate(-1.5deg); transition: transform .35s cubic-bezier(.2,1.6,.5,1), box-shadow .35s; }
.card .page-shot.developed { transform: rotate(-1.5deg) scale(1.05); box-shadow: 0 0 0 3px var(--gold), 0 8px 24px rgba(0,0,0,.3); }
/* Short phone screens: slimmer plaques and buttons so the sticker sheet keeps its room. */
@media (max-height: 720px) {
  .screen { gap: 5px; padding-block: 6px; }
  #play .hud .btn.sq { width: 40px; min-height: 40px; }
  #play .pct { width: 42px; height: 42px; font-size: 14px; }
  #play .hud .mid { padding: 2px 8px; }
  #play .hud .mid b { font-size: 15px; }
  #play .hud .mid span { font-size: 10px; }
  #play .hud-stars { padding: 4px 4px; }
  #play .art-card { padding: 8px; border-radius: 18px; }
  #play .art-card canvas { outline-offset: 4px; box-shadow: 0 0 0 3px #FFF8EA; }
  #play .boost { min-height: 38px; font-size: 13px; }
  #play .boost .ico { width: 20px; height: 20px; }
}
@media (prefers-reduced-motion: reduce) { .card, .big-stars .star { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="home" hidden></section>
  <section class="screen" id="play" hidden>
    <div class="hud">
      <button class="btn sq" id="backBtn" type="button" aria-label="Về danh sách tranh"><svg class="ico" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="#2A2438" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="mid"><span id="lvNum"></span><b id="lvName"></b></div>
      <div class="hud-stars" id="hudStars"></div>
      <div class="pct" id="pct">0%</div>
      <button class="btn sq help" id="helpBtn" type="button" aria-label="Cách chơi">?</button>
    </div>
    <div class="art-card">
      <canvas id="art" aria-label="Cuốn sổ sticker đang dán"></canvas>
    </div>
    <canvas id="trays" aria-label="Hộp sticker"></canvas>
    <div class="stage" id="stage">
      <canvas id="board" tabindex="0" aria-label="Tờ sticker"></canvas>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="boosters" id="boosters"></div>
  </section>
  <div id="modals"></div>
</div>
<canvas id="fly"></canvas>
<canvas id="fx"></canvas>
<script>
/* Peel Off core: pure rules with no DOM. Runs in the browser and in Node (tools/test-core.js). */
(function (root) {
  'use strict';
  var PO = root.PO = root.PO || {};

  var BOARD_W = 360, BOARD_H = 440, S = 64, PITCH = 68;
  var BASE_CAP = 7, MAX_CAP = 10, LEVELS_PER_ALBUM = 20, ALBUM_COUNT = 6, DESIGNS_PER_ALBUM = 10;
  /* Two stickers overlap on the sheet when their centres are closer than this. */
  var OVERLAP_DIST = S * 0.86;

  function makeRng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);

    if (boostBtns.magnet) boostBtns.magnet.classList.toggle('on', on);
    artCv.style.cursor = on ? 'pointer' : '';
  }
  artCv.addEventListener('pointerdown', function (e) {
    if (!picking || !running || Game.busy()) return;
    var hit = null, best = 1e9;
    slots.forEach(function (sl) {
      var p = slotScreen(sl), d = Math.hypot(e.clientX - p.x, e.clientY - p.y), r = sl.s * bookH * 0.7;
      if (d < r && d < best && sl.filledAt < 0) { best = d; hit = sl; }
    });
    if (!hit) return;
    var ids = magnetTarget(hit);
    if (!ids) { Snd.thud(); toast(hit.reserved || model.count(hit.type) >= 3 ? 'Ô này sắp được dán rồi.' : 'Hộp không đủ chỗ cho bộ ba này.'); return; }
    setPicking(false);
    var b = boostBtns.magnet.getBoundingClientRect(), br = $('board').getBoundingClientRect(), to = slotScreen(hit);
    boosts.magnet--; renderBoosters();
    lastAct = performance.now() / 1000; stuck = -1;
    magFx = { t0: performance.now() / 1000, x0: b.left + b.width / 2, y0: b.top + b.height / 2, x1: Math.min(Math.max(to.x, br.left + 40), br.right - 40), y1: br.top + 44, out: 0.5 + ids.length * 0.12 + 0.35 };
    Game.pull(ids);
  });
  var MAG = typeof Path2D !== 'undefined' ? [new Path2D('M4 3h5v9a3 3 0 0 0 6 0V3h5v9a8 8 0 0 1-16 0Z'), new Path2D('M4 3h5v4H4ZM15 3h5v4h-5Z')] : null;
  function renderMagnet() {
    if (!magFx || !MAG) { magFx = null; return; }
    var t = performance.now() / 1000 - magFx.t0, f = magFx, x, y, rot, sc, alpha = 1;
    if (reduced) { if (t > f.out) magFx = null; return; }
    if (t < 0.35) {
      var e = 1 - Math.pow(1 - t / 0.35, 3);
      x = f.x0 + (f.x1 - f.x0) * e; y = f.y0 + (f.y1 - f.y0) * e - Math.sin(e * Math.PI) * 40;
      rot = Math.PI * e; sc = 0.9 + 0.6 * e;
    } else if (t < f.out) {
      x = f.x1 + Math.sin(t * 34) * 1.6; y = f.y1 + Math.sin(t * 6) * 3; rot = Math.PI + Math.sin(t * 20) * 0.05; sc = 1.5;
    } else {
      var o = (t - f.out) / 0.35;
      if (o >= 1) { magFx = null; return; }
      x = f.x1 + o * o * 260; y = f.y1 - o * 120; rot = Math.PI + o * 1.2; sc = 1.5 - o * 0.4; alpha = 1 - o;
    }
    flyX.save();
    flyX.globalAlpha = alpha;
    flyX.translate(x, y); flyX.rotate(rot); flyX.scale(sc * 1.6, sc * 1.6); flyX.translate(-12, -12);
    flyX.shadowColor = 'rgba(0,0,0,.3)'; flyX.shadowOffsetY = 2;
    flyX.fillStyle = '#F2543D'; flyX.fill(MAG[0]);
    flyX.shadowColor = 'transparent';
    flyX.lineWidth = 2; flyX.strokeStyle = '#2A2438'; flyX.lineJoin = 'round'; flyX.stroke(MAG[0]);
    flyX.fillStyle = '#FFF'; flyX.fill(MAG[1]); flyX.stroke(MAG[1]);
    if (t > 0.3 && t < f.out) {
      flyX.strokeStyle = '#FFD654'; flyX.lineWidth = 1.4;
      for (var k = 0; k < 2; k++) {
        var px = k ? 17.5 : 6.5, j = Math.sin(t * 60 + k * 2) * 2;
        flyX.beginPath(); flyX.moveTo(px - 2, 1); flyX.lineTo(px + j, -2); flyX.lineTo(px - j, -5); flyX.stroke();
      }
    }
    flyX.restore();
  }
  /* The helper that would help most wiggles: Thêm ô when one box slot is left, otherwise after 6 s idle. */
  function hintBoost(now) {
    var pick = null;
    if (running && !busy() && !$('modals').firstChild) {
      if (boosts.slot > 0 && slotsAdded < MAX_ADDED && model.cap < H.MAX_CAP - 1 && model.cap - model.used() === 1) pick = 'slot';
      else if (now - lastAct > 6) pick = boosts.magnet > 0 && slots.some(function (sl) { return sl.filledAt < 0 && !sl.reserved; }) ? 'magnet' : boosts.shuffle > 0 ? 'shuffle' : null;
    }
    Object.keys(boostBtns).forEach(function (n) { boostBtns[n].classList.toggle('hint', n === pick); });
  }

  /* ---------- how to play, and first-time popups ---------- */
  function showHowTo(then) {
    Game.setPaused(true);
    modal(function (card, close) {
      card.classList.add('howto');
      card.appendChild(el('h2', '', 'Cách chơi'));
      var goal = el('div', 'goal'), gc = el('canvas'), gw = 90, gh = 54, rr = Math.min(root.devicePixelRatio || 1, 2);
      gc.width = gw * rr; gc.height = gh * rr; gc.style.width = gw + 'px'; gc.style.height = gh + 'px';
      var gx = gc.getContext('2d'); gx.setTransform(rr, 0, 0, rr, 0, 0);
      drawBook(gx, gw, gh, { left: leftSlots, right: slots }, { full: true, cover: pageName(lv.def) });
      goal.appendChild(gc);
      var gp = el('p'); gp.innerHTML = '<b>Mục tiêu</b>Gom đủ sticker mà trang sổ yêu cầu và dán kín trang.';
      goal.appendChild(gp);
      card.appendChild(goal);
      var want = lv.targets[0], junk = lv.junk[0];
      function icon(id, size) { var c = el('canvas'); paintSticker(c, id, size); return c; }
      var ol = el('ol');
      function step(n, pic, html) {
        var li = el('li'), num = el('span', 'n', String(n)), t = el('span');
        t.innerHTML = html;
        li.appendChild(num); li.appendChild(pic); li.appendChild(t); ol.appendChild(li);
      }
      var p1 = el('span', 'pic big'); p1.appendChild(icon(want, 44));
      step(1, p1, '<b>Chạm</b> vào sticker để bóc. Sticker bóc ra vào <b>hộp</b> bên dưới sổ.');
      var p2 = el('span', 'pic wait'); p2.appendChild(icon(want, 22)); p2.appendChild(icon(want, 22)); p2.appendChild(icon(want, 22));
      step(2, p2, 'Đủ <b>3 cái giống nhau</b>: nếu <b>trang sổ cần</b> thì gộp lại <b>bay vào sổ</b>.');
      var p3 = el('span', 'pic wait'); p3.appendChild(icon(junk, 22)); p3.appendChild(icon(junk, 22)); p3.appendChild(el('i'));
      step(3, p3, 'Sticker trang không cần là <b>đồ thừa</b>: đủ 3 cái thì tự dọn. Hộp có hạn, <b>đừng để đầy</b>!');
      card.appendChild(ol);
      var rule = el('p', 'rule');
      rule.innerHTML = '<b>Thắng:</b> dán kín trang sổ.<br><b>Thua:</b> hộp đầy và không bóc được gì nữa.';
      card.appendChild(rule);
      var a = el('div', 'acts');
      a.appendChild(btn('Chơi thôi!', 'primary big wide', function () {
        close();
        Game.setPaused(false);
        save.howto = true; persist();
        if (then) then();
      }));
      card.appendChild(a);
    });
  }
  $('helpBtn').addEventListener('click', function () { Snd.click(); if (lv && running) showHowTo(); });
  var MECHS = {
    tape: { title: 'Băng dính', html: 'Sticker bị <b>dán băng dính</b> chưa bóc được. Số trên băng giảm 1 mỗi lần bạn <b>ghép xong một bộ ba</b> trong hộp. Về 0 thì băng tự bung ra.' },
    mystery: { title: 'Sticker úp', html: 'Sticker <b>úp mặt</b> chỉ lộ hình khi không còn sticker nào đè lên nó. Có thể là sticker trang sổ cần, cũng có thể là đồ thừa.' }
  };
  function showMechanics(list) {
    if (!list.length) return;
    var kind = list[0], m = MECHS[kind];
    Game.setPaused(true);
    modal(function (card, close) {
      card.classList.add('howto', 'mech');
      card.appendChild(el('h2', '', 'Mới: ' + m.title));
      var pic = el('span', 'mech-pic ' + kind), c = el('canvas');
      paintSticker(c, lv.targets[0], 72);
      pic.appendChild(c);
      pic.appendChild(el('i', '', kind === 'tape' ? '2' : '?'));
      card.appendChild(pic);
      var p = el('p'); p.innerHTML = m.html; card.appendChild(p);
      var a = el('div', 'acts');
      a.appendChild(btn('Đã hiểu', 'primary big wide', function () {
        close();
        save.seen = save.seen || {}; save.seen[kind] = true; persist();
        Game.setPaused(false);
        showMechanics(list.slice(1));
      }));
      card.appendChild(a);
    });
  }

  /* ---------- level flow ---------- */
  function startLevel(i) {
    levelIdx = i;
    lv = H.build(i);
    var level = PO.Core.buildLevel(lv.cfg), tuned = H.setup(level, lv.targets, lv.def.cap);
    baseCap = tuned.cap;
    model = new H.Model(lv.targets, tuned.cap);
    items = {}; takes = []; clearing = []; junkPeeled = 0; par = tuned.par; stuck = 0; running = true;
    combo = 0; comboPops = []; comboBreak = null; praised = {}; lastPraise = -9; lastClear = -9; slotAnim = null;
    lastAct = performance.now() / 1000; picking = false; magFx = null; artCv.style.cursor = ''; slotsAdded = 0;
    flights = []; sparks = []; rings = []; winPending = null; shine = -1; chunkSound = 0; continued = false;
    /* Test build: plenty of every helper. */
    boosts = { slot: 100, magnet: 100, shuffle: 100 };
    $('home').hidden = true; $('play').hidden = false;
    $('modals').innerHTML = '';
    $('lvNum').textContent = 'Trang ' + (i + 1) + (lv.def.hard ? ' · KHÓ' : '');
    $('play').classList.toggle('hard', !!lv.def.hard);
    if (lv.def.hard) hardSplash();
    $('lvName').textContent = pageName(lv.def);
    sheets = splitSheets(lv.targets); sheetIdx = 0; leftSlots = null; stored = {}; storedN = 0; flip = null;
    slots = buildPage(sheets[0], 1, lv.cfg.seed);
    sizeBook(); sizeFly(); sizeBox();
    $('hudStars').innerHTML = stars(3);
    renderBoosters();
    Snd.setMusicKey(lv.def.album);
    Snd.setPlaying(true);
    Game.configure({ tapPeel: true, haptics: true, idleHint: i < 2 });
    Game.start(lv.cfg, {
      hud: function () {},
      toast: function (m) { toast(m.key === 'beltFull' ? 'Hộp đầy rồi! Chỉ bóc được cái thứ ba của một cặp trong hộp.' : I18n.t(m.key, m)); },
      peel: onPeel,
      take: onTake,
      canTake: canTake,
      rank: rank
    });
    if (i === 0 && !save.howto) showHowTo();
    else showMechanics(['tape', 'mystery'].filter(function (k) { return lv.def.mods[k] && !(save.seen && save.seen[k]); }));
  }
  function onLose() {
    running = false;
    Game.end(false);
    Snd.lose();

      card.appendChild(el('h2', '', 'Hộp đầy rồi!'));

      var a = el('div', 'acts');
      if (!continued && model.cap < H.MAX_CAP - 1) a.appendChild(btn('Thêm 2 ô và chơi tiếp', 'primary big wide', function () {
        continued = true; close(); model.cap = Math.min(H.MAX_CAP - 1, model.cap + 2); stuck = 0; running = true; Game.resume();
        $('hudStars').innerHTML = stars(starsNow());
      }));
      a.appendChild(btn('Chơi lại trang này', continued ? 'primary big wide' : 'wide', function () { close(); startLevel(levelIdx); }));
      a.appendChild(btn('Về cuốn sổ', 'wide', function () { close(); showHome(); }));
      card.appendChild(a);
    });
  }
  function celebrate(r) {
    winPending = null;
    running = false;
    Game.end(true);
    shine = performance.now() / 1000 + 0.2;
    Snd.win();
    confetti(120);
    var starsWon = continued ? 1 : r.stars;
    if (starsWon > (save.stars[levelIdx] || 0)) save.stars[levelIdx] = starsWon;
    save.unlocked = Math.max(save.unlocked, Math.min(H.PAGES.length, levelIdx + 2));
    persist();
    var last = levelIdx === H.PAGES.length - 1;
    setTimeout(function () {
      modal(function (card, close) {
        var s = el('div', 'big-stars'); s.innerHTML = stars(starsWon); card.appendChild(s);
        if (starsWon === 3 && junkPeeled < par) card.appendChild(el('div', 'perfect', 'Hoàn hảo!'));
        card.appendChild(el('h2', '', last ? 'Đầy cả cuốn sổ!' : 'Trang sổ đã đầy!'));
        var c = el('canvas', 'page-shot'), cw2 = 280, ch2 = 168, rr = Math.min(root.devicePixelRatio || 1, 2);
        c.width = cw2 * rr; c.height = ch2 * rr; c.style.width = cw2 + 'px'; c.style.height = ch2 + 'px';
        var cx2 = c.getContext('2d'); cx2.setTransform(rr, 0, 0, rr, 0, 0);
        drawBook(cx2, cw2, ch2, { left: leftSlots, right: slots }, { full: true, title: sheetTitle(), cover: pageName(lv.def) });
        card.appendChild(c);
        setTimeout(function () { c.classList.add('developed'); Snd.star(4); }, reduced ? 0 : 350);
        var sc = el('p', 'score'); sc.innerHTML = 'Bóc thừa <b>' + junkPeeled + '</b> · Chuẩn <b>' + par + '</b>'; card.appendChild(sc);
        card.appendChild(el('p', '', continued ? 'Hoàn thành nhờ thêm ô. Chơi lại không thêm ô để có thêm sao.' : starsWon === 3 ? 'Đào gọn gàng. Tuyệt vời!' : 'Bóc thừa là bóc sticker không có trên trang. Bóc thừa tối đa ' + par + ' cái để được 3 sao.'));
        var a = el('div', 'acts');
        if (!last) a.appendChild(btn('Trang tiếp theo', 'primary big wide', function () { close(); startLevel(levelIdx + 1); }));
        a.appendChild(btn('Chơi lại', 'wide', function () { close(); startLevel(levelIdx); }));

  }
  $('backBtn').addEventListener('click', function () { Snd.click(); showHome(); });

  /* ---------- confetti ---------- */
  var fxCv = $('fx'), fxX = fxCv.getContext('2d'), parts = [], fxRaf = 0, fxLast = 0;
  function confetti(n) {
    if (reduced) return;
    var W = root.innerWidth, Hh = root.innerHeight;
    fxCv.width = W; fxCv.height = Hh;
    var cols = ['#FF5A6E', '#FFD531', '#3FC1C9', '#8E63E9', '#7BD45E', '#FF9A2F', '#FFF'];
    for (var i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * Hh * 0.5, vx: (Math.random() - 0.5) * 70, vy: 130 + Math.random() * 190, a: Math.random() * 6, va: (Math.random() - 0.5) * 9, s: 5 + Math.random() * 7, c: cols[i % cols.length] });
    function frame(now) {
      var dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
      fxX.clearRect(0, 0, W, Hh);
      for (var j = parts.length - 1; j >= 0; j--) {
        var p = parts[j];
        p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
        if (p.y > Hh + 20) { parts.splice(j, 1); continue; }
        fxX.save(); fxX.translate(p.x, p.y); fxX.rotate(p.a); fxX.fillStyle = p.c; fxX.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); fxX.restore();
      }
      fxRaf = parts.length ? requestAnimationFrame(frame) : 0;
    }
    if (!fxRaf) { fxLast = performance.now(); fxRaf = requestAnimationFrame(frame); }
  }

  /* ---------- home: the book's pages ---------- */
  function showHome() {
    Game.stop();
    lv = null; flights = []; sparks = []; rings = []; model = null; items = {}; takes = []; clearing = []; running = false;

  }

  /* ---------- frame ---------- */
  var last = performance.now(), timeScale = 1;
  function frame(nowMs) {
    var dt = Math.min(0.05, (nowMs - last) / 1000) * timeScale; last = nowMs;
    if (lv) {
      var now = nowMs / 1000;
      renderBook(now);
      if (model) { updateBox(dt); renderBox(now); }
      renderFlights(dt);
      if (model) { renderTakes(dt); renderMagnet(); drawCombo(); checkStuck(dt); hintBoost(now); }
      $('pct').textContent = bookPct() + '%';
      if (running && model && model.done() && !winPending) winPending = { stars: starsNow() };
      /* A full sheet turns over once its stickers have landed; the level is won when the last sheet is full. */
      if (!flip && !flights.length && sheetIdx < sheets.length - 1 && sheetDone(now)) startFlip(now);
      if (winPending && !flights.length && bookDone(now)) celebrate(winPending);
    }
    requestAnimationFrame(frame);
  }
  Game.bind($('board'), $('stage'));
  function resizeAll() { if (lv) { sizeBook(); sizeFly(); sizeBox(); } }
  root.addEventListener('resize', resizeAll);
  if (root.visualViewport) root.visualViewport.addEventListener('resize', resizeAll);
  if (root.ResizeObserver) new ResizeObserver(resizeAll).observe($('app'));
  root.addEventListener('pointerdown', function () { Snd.unlock(); }, { once: true });
  showHome();
  requestAnimationFrame(frame);

  /* Test hook: plays the next sticker of the page's proof order. */
  PO.PixelUI = { start: startLevel, step: function () { return Game.debugStep(); }, state: function () { return Game.debugState(); }, slow: function (k) { timeScale = k; } };
})(window);
